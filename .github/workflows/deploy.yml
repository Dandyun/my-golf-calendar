name: Deploy My Golf Calendar (Static + GolfCourseAPI)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Verify website files
        run: |
          test -s site/index.html
          test -s site/app.js
          test -s site/courses.js
          test -s site/styles.css
          test -s scripts/update_golfcourseapi.py
      - name: Prepare public course scorecard cache (API key stays private)
        env:
          GOLFCOURSEAPI_KEY: ${{ secrets.GOLFCOURSEAPI_KEY }}
        run: python3 scripts/update_golfcourseapi.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
